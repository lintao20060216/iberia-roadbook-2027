<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f3eb"><title>全球旅行规划</title><meta name="description" content="个人收藏、旅行项目与自驾行程。"><link rel="stylesheet" href="/style.css?v=3">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/workspace.css?v=6">
</head><body class="work">
<header class="top"><a class="brand" href="/account/" aria-label="全球旅行规划主页"><span class="logo">✳</span><span><strong>全球旅行规划</strong><small>GLOBAL TRAVEL PLANNER</small></span></a><nav aria-label="主导航"><button data-work-tab="map" class="active">地图与收藏</button><button data-work-tab="plan">每日行程</button><button data-work-tab="ai">AI 助手</button><a class="secondary work-guest" href="/">访客视图</a></nav><div class="trip"><span class="tripdot"></span><span><b>私人旅行空间</b><small>邮箱已登录</small></span></div></header>
<main class="workspace">
<section class="maparea" aria-label="互动旅行地图">
<div id="streetMap"></div><canvas id="atlas" aria-label="拖动旋转地球，滚轮或双指缩放"></canvas>
<div class="maptitle"><div class="overline"><span></span> 全球收藏 / MY WORLD</div><h1>我的旅行地球</h1><p>从收藏出发，规划下一段旅程</p></div>
<div class="maptools"><button id="resetMap" title="定位项目" aria-label="定位项目">⌖</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="worldMap" aria-label="全球视图" title="全球视图">◉</button></div>
<div class="layerbar"><button data-layer="street" class="chosen">街道</button><button data-layer="satellite">卫星</button></div>
<div id="mapStatus" role="status">拖动地图 · 双指缩放</div><div class="mapcredit" id="mapCredit">Natural Earth</div>
</section>
<aside class="panel" id="panel"><button class="sheetGrip" id="sheetGrip" aria-label="展开或收起地点面板"><span></span></button><div id="panelContent"><p role="status">正在读取私人存档…</p></div></aside>
</main>
<div id="toast" role="status"></div><div id="printArea"></div><dialog id="workDialog"><form></form></dialog>
<script src="/account/places.js?v=6" defer></script><script src="/map.js?v=6" defer></script><script type="module" src="/workspace.mjs?v=6"></script>
</body></html>
